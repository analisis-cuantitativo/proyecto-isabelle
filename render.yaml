services:
  # Isabelle/AFP proof service. Internal only — nothing outside your other
  # Render services needs to reach this directly.
  - type: pserv
    name: deepisahol
    runtime: docker
    plan: starter           # start small; bump to standard/pro if Isabelle+AFP needs more CPU/RAM
    region: oregon
    dockerfilePath: ./DeepIsaHOL/Dockerfile
    dockerContext: ./DeepIsaHOL
    # No healthCheckPath: Render rejects it for pserv (private) services.
    envVars:
      - key: PY4J_PORT
        value: 25333
      - key: API_PORT
        value: 8000

  # FastAPI backend. Public (the frontend's nginx proxies /api/ to it).
  - type: web
    name: backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # fromService/hostport resolves to "host:port" with no scheme;
      # _resolve_api_url() in src/proyecto_isabelle/query/isabelle.py
      # prepends http:// when one is missing.
      - key: ISABELLE_API_URL
        fromService:
          name: deepisahol
          type: pserv
          property: hostport
      - key: CORS_ALLOW_ORIGINS
        sync: false          # set to the frontend's onrender.com URL after first deploy
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_EMAIL
        sync: false
      - key: SUPABASE_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false

  # Static frontend, served via the existing nginx Dockerfile.
  - type: web
    name: frontend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_ADDR
        fromService:
          name: backend
          type: web
          property: hostport
