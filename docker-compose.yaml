services:
  deepisahol:
    build:
      context: ./DeepIsaHOL
      dockerfile: Dockerfile
      # Explicit local cache export/import for the heap build below — matters
      # most once you opt into a non-trivial DEEPISAHOL_EXTRA_SESSIONS (the
      # full Analysis/Probability/Benchmark config costs ~40min). Without
      # this, that layer's cache lives only in Docker Desktop's own buildkit
      # store, which caps ALL local-COPY-sourced cache (across every project
      # on the machine, not just this one) at ~2.7GiB by default — small
      # enough that other builds rotate this one out within the hour, forcing
      # a full heap rebuild on the next `docker compose build deepisahol`
      # even when nothing in benchmark/ changed. `mode=max` is required (not
      # the default `min`) because the heap build runs in the discarded
      # `builder` stage, not the final image — `min` only ever exports cache
      # for layers that make it into the final image.
      cache_from:
        - type=local,src=${HOME}/.cache/docker-buildx/deepisahol
      cache_to:
        - type=local,dest=${HOME}/.cache/docker-buildx/deepisahol,mode=max
      args:
        # Which Isabelle library sessions get prebuilt into the `Benchmark`
        # heap. Defaults to the cheapest possible heap (bare HOL, seconds to
        # build). See DeepIsaHOL/README.md ("Configuring which Isabelle
        # libraries are built") for the full session list and a worked
        # example reproducing the old always-on Analysis/Probability set.
        DEEPISAHOL_PARENT_SESSION: ${DEEPISAHOL_PARENT_SESSION:-HOL}
        DEEPISAHOL_EXTRA_SESSIONS: ${DEEPISAHOL_EXTRA_SESSIONS:-}
        # Benchmark heap-build parallelism (only matters once the config
        # above is non-trivial). Empty THREADS => auto (all CPUs the build
        # sees, capped by RAM). Override via the shell or a .env file, e.g.
        # BENCHMARK_THREADS=6 BENCHMARK_JOBS=2 docker compose build deepisahol
        BENCHMARK_THREADS: ${BENCHMARK_THREADS:-}
        BENCHMARK_JOBS: ${BENCHMARK_JOBS:-1}
    platform: linux/amd64
    container_name: deepisahol-api
    ports:
      - "8001:8000"
    environment:
      - PY4J_PORT=25333
      - API_PORT=8000
      - STARTUP_WAIT=30
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ISABELLE_API_URL=http://deepisahol:8000
      - CORS_ALLOW_ORIGINS=http://localhost:5173
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_EMAIL=${SUPABASE_EMAIL}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}

    depends_on:
      deepisahol:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - BACKEND_ADDR=backend:8000
    depends_on:
      - backend
    restart: unless-stopped
