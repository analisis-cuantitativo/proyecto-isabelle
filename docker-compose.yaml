services:
  deepisahol:
    build:
      context: ./DeepIsaHOL
      dockerfile: Dockerfile
      args:
        # Benchmark heap-build parallelism. Empty THREADS => auto (all CPUs the
        # build sees, capped by RAM). Override via the shell or a .env file, e.g.
        # BENCHMARK_THREADS=6 BENCHMARK_JOBS=2 docker compose build deepisahol
        BENCHMARK_THREADS: ${BENCHMARK_THREADS:-}
        BENCHMARK_JOBS: ${BENCHMARK_JOBS:-1}
    platform: linux/amd64
    container_name: deepisahol-api
    ports:
      - "8001:8000"
    environment:
      - PY4J_PORT=25333
      - API_PORT=8000
      - STARTUP_WAIT=30
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ISABELLE_API_URL=http://deepisahol:8000
      - CORS_ALLOW_ORIGINS=http://localhost:5173
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_EMAIL=${SUPABASE_EMAIL}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}

    depends_on:
      deepisahol:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - BACKEND_ADDR=backend:8000
    depends_on:
      - backend
    restart: unless-stopped
